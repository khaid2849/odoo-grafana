apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 2000

  # Read-only role created by monitoring/postgres/setup-grafana-role.sh
  - name: Odoo PostgreSQL
    uid: odoo-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: grafana_ro
    jsonData:
      database: ${ODOO_DB}
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 5
      timescaledb: false
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
