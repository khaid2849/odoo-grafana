# Locations to add to the nginx `server` block that proxies Odoo.
# `$connection_upgrade` comes from the usual Odoo websocket map:
#
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Prometheus endpoint of the grafana module: scraped inside the docker
# network only, never exposed through the public entrypoint.
location ^~ /metrics {
    return 404;
}

# Static files of the grafana Odoo module (app icon, description images)
# share the /grafana/ prefix: they belong to Odoo, not to Grafana, which
# serves its own assets from /grafana/public/.
location ^~ /grafana/static/ {
    proxy_pass http://odoo;  # the upstream that serves Odoo
    proxy_redirect off;
}

# Grafana, same origin as Odoo so it can be embedded in the Odoo backend. The
# upstream is resolved at request time (127.0.0.11 is Docker's DNS), so nginx
# still starts when the monitoring stack is not running.
location /grafana/ {
    resolver 127.0.0.11 valid=30s;
    set $grafana_upstream http://grafana:3000;
    proxy_pass $grafana_upstream;
    proxy_http_version 1.1;
    # proxy_set_header here replaces the server-level ones, repeat them
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    # Grafana Live websocket
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
